[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical_llm"
version = "0.1.0"
description = "A modular PyTorch Transformer & NLP pipeline for medical sequence and mortality prediction"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "pandas",
    "numpy",
    "scikit-learn",
    "transformers"
]

[tool.setuptools.packages.find]
where = ["src"]
